<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Помогатор: степени</title>
<style>
:root{--bg:#f4f5f1;--card:#fff;--ink:#1e2723;--muted:#56625c;--line:#d3d9d4;--acc:#1f6b57;--acc2:#e6f1ec;--ok:#1d6b3a;--okbg:#e7f4eb;--bad:#9a3412;--badbg:#fbede5;--part:#7a5a00;--partbg:#fbf3d9;--hint:#eef2fa;--hintb:#3b5ba5}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.5rem;padding:.45rem .6rem;background:#fff;border-bottom:1px solid var(--line)}
.top h1{flex:1;font-size:1.05rem;margin:0;text-align:center;line-height:1.2}
main{max-width:780px;margin:0 auto;padding:1rem .8rem 2rem;outline:none}
h2{font-size:1.35rem;margin:.4rem 0 .6rem}
h3{font-size:1.1rem;margin:1rem 0 .4rem}
p{margin:.5rem 0}
.lead{font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.92rem}
.btn{min-height:48px;padding:.55rem 1rem;border:1.5px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--acc);color:#fff}
.btn.ghost{border-color:#9aa59f;color:var(--ink)}
.btn.sm{min-height:40px;padding:.35rem .7rem;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,.fb:focus-visible,main:focus-visible{outline:3px solid #e0a800;outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.8rem 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7rem}
.tile{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:.9rem 1rem;font:inherit;color:inherit;cursor:pointer;min-height:96px}
.tile b{display:block;font-size:1.08rem;color:var(--acc);margin-bottom:.2rem}
.tile span{display:block;font-size:.92rem;color:var(--muted)}
.tile em{display:block;font-style:normal;font-size:.85rem;margin-top:.35rem;color:var(--ink)}
.tile:hover{border-color:var(--acc)}
.m{font-family:"Cambria Math","STIX Two Math","Times New Roman",Times,serif;font-size:1.18em;white-space:nowrap}
.m sup{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25}
.fr>.fn{border-bottom:1.5px solid currentColor;padding:0 .25em .08em;text-align:center}
.fr>.fd{padding:.08em .25em 0;text-align:center}
.prompt{font-size:1.45rem;text-align:center;padding:.7rem .5rem;background:var(--acc2);border-radius:10px;overflow-x:auto;margin:.3rem 0}
.prompt .m{font-size:1.1em}
.ask{font-weight:600}
.inp{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 0;font-size:1.35rem}
input.f{font:inherit;font-size:1.1rem;width:3.6em;min-height:46px;padding:.25rem;border:1.5px solid #7d8a83;border-radius:8px;text-align:center;background:#fff;color:var(--ink)}
input.f:disabled{background:#f1f3f1}
input.ex{width:2.7em;min-height:38px;font-size:.95rem;position:relative;top:-.7em;margin-left:1px}
.mono-in{display:inline-flex;align-items:center;flex-wrap:wrap;gap:.3rem;justify-content:center}
.vv{display:inline-flex;align-items:center;font-family:"Times New Roman",Times,serif;font-size:1.5rem;padding-top:.6em}
.vl{padding-right:1px}
.fr-in{display:inline-flex;flex-direction:column;align-items:center}
.fr-in>.fn{border-bottom:2.5px solid var(--ink);padding:0 .3rem .4rem}
.fr-in>.fd{padding:.4rem .3rem 0}
.br{font-family:"Times New Roman",serif;font-size:2.4rem;line-height:1}
.brsup{font-family:"Times New Roman",serif;font-size:1.2rem;align-self:flex-start;margin-top:.1rem}
.note{font-size:.85rem;color:var(--muted);text-align:center;margin:.1rem 0 .3rem}
.fb{border-radius:10px;padding:.15rem .85rem;margin:.6rem 0;outline:none}
.fb:empty{display:none}
.fb.ok{background:var(--okbg);border-left:6px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:6px solid var(--bad)}
.fb.part{background:var(--partbg);border-left:6px solid var(--part)}
.fb.info{background:#f0f2f0;border-left:6px solid #7d8a83}
.opt{display:block;width:100%;text-align:left;margin:.45rem 0;color:var(--ink);border-color:#9aa59f;font-weight:500}
.opt[aria-pressed=true]{background:var(--acc2);border-color:var(--acc);font-weight:700}
.opt.wrong{border-style:dashed}
.opt.wrong::after{content:"  — не подходит";font-weight:400;color:var(--bad)}
.opt.right::after{content:"  — подходит";font-weight:600;color:var(--ok)}
.hint{background:var(--hint);border-left:5px solid var(--hintb);padding:.45rem .8rem;margin:.45rem 0;border-radius:8px}
.sol{margin-top:.5rem}
.sol:empty{display:none}
.solbox{background:#fafaf7;border:1px dashed #9aa59f;border-radius:10px;padding:.5rem .9rem}
.work{background:#fafaf7;border:1px solid var(--line);border-radius:10px;padding:.5rem .9rem}
.work ol{margin:.3rem 0;padding-left:1.3rem}
.work li{margin:.35rem 0}
.prog{font-size:.9rem;color:var(--muted)}
.bar{height:8px;background:#e1e6e2;border-radius:6px;overflow:hidden;margin:.3rem 0 .8rem}
.bar i{display:block;height:100%;background:var(--acc)}
.review{background:#fff7e6;border:1.5px solid #c99a2e;border-radius:12px;padding:.6rem .9rem;margin:.6rem 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:.45rem .3rem;text-align:left;vertical-align:top}
.tag{display:inline-block;font-size:.8rem;padding:.05rem .5rem;border-radius:20px;border:1px solid #9aa59f;margin-left:.3rem}
.lvls{display:flex;flex-wrap:wrap;gap:.35rem}
.lvls .btn{min-width:48px}
.lvls .btn[aria-current=true]{background:var(--acc);color:#fff}
.qnav{display:flex;flex-wrap:wrap;gap:.3rem}
.qnav .btn{min-width:46px;padding:.3rem}
.qnav .btn.has{background:var(--acc2)}
.qnav .btn[aria-current=true]{outline:3px solid var(--acc)}
.timer{font-weight:700;font-variant-numeric:tabular-nums}
.formula{font-size:1.45rem;text-align:center;padding:.6rem;background:var(--acc2);border-radius:10px;margin:.3rem 0}
.wrongbox{background:var(--badbg);border-radius:10px;padding:.4rem .8rem}
details{margin:.4rem 0}
summary{cursor:pointer;font-weight:600;min-height:40px;padding:.4rem 0}
/* виджет сокращения */
.cw{background:#fafaf7;border:1px solid var(--line);border-radius:12px;padding:.6rem;margin:.6rem 0;text-align:center}
.cw-f{display:inline-flex;flex-direction:column;align-items:center;font-family:"Times New Roman",serif;font-size:1.6rem}
.cw-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding:.15rem .4rem;min-height:2.4em}
.cw-line{align-self:stretch;border-top:2.5px solid var(--ink);margin:.1rem 0}
.tok{position:relative;display:inline-flex;flex-direction:column;align-items:center;min-width:1.05em;padding:0 .05em}
.tok .pr{font:600 .7rem/1 system-ui,sans-serif;color:var(--muted);height:.8rem}
.tok.gone .lt{color:#8a948f}
.tok.gone .lt::after{content:"";position:absolute;left:-3px;right:-3px;top:.55em;border-top:2.5px solid var(--ink);transform:rotate(-35deg)}
.dot{padding:0 .05em}
.cw-msg{font-size:.95rem;margin:.4rem 0 0}

.m .bp{font-size:1.9em;line-height:1;vertical-align:middle;font-weight:300}
.pp-in{flex-wrap:nowrap!important;gap:.15rem!important}
.pp-in .cf{width:2.9em}
@media (max-width:420px){.inp input.ex{width:2.3em}.inp input.cf{width:2.7em}.pp-in .vv{font-size:1.3rem}.cw-f{font-size:1.3rem}.br{font-size:2rem}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:560px){.cmp{grid-template-columns:1fr}html{font-size:16px}.prompt{font-size:1.3rem}}
/* памятка */
.modal{position:fixed;inset:0;background:rgba(20,30,25,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:1rem .5rem 4rem}
.modal[hidden]{display:none}
.panel{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:calc(100vh - 5.5rem);overflow:auto;padding:1rem 1.1rem}
.panel ul{padding-left:1.2rem}
.panel li{margin:.3rem 0}
.ptab td,.ptab th{padding:.3rem}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <button class="btn sm ghost" id="homeBtn" type="button">Главная</button>
  <h1>Помогатор: степени</h1>
  <button class="btn sm" id="memoBtn" type="button" aria-haspopup="dialog">Памятка</button>
</header>
<main id="app" tabindex="-1"><p>Загрузка… Если этот текст не исчезает, в браузере выключен JavaScript.</p></main>
<div id="memo" class="modal" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="memoTitle" tabindex="-1">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">
      <h2 id="memoTitle" style="margin:0">Памятка</h2>
      <button class="btn sm" id="memoClose" type="button">Закрыть</button>
    </div>
    <div id="memoBody"></div>
  </div>
</div>
<script>
'use strict';
/* ===================== Сохранение ===================== */
var KEY = 'pomogator-stepeni-v1';
function defaults(){ return {lessons:{}, cards:{}, level:1, maxLevel:1, streak:0, skills:{}, errors:{}, fixed:{}, recent:[], tests:[], chooseBest:0, together:{}, timerOn:false}; }
var storageOK = true;
var D = (function(){
  var d = defaults();
  try {
    localStorage.setItem(KEY + '-test', '1'); localStorage.removeItem(KEY + '-test');
    var s = localStorage.getItem(KEY);
    if (s) { var o = JSON.parse(s); for (var k in o) if (k in d) d[k] = o[k]; }
  } catch (e) { storageOK = false; }
  return d;
})();
function save(){ if (!storageOK) return; try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { storageOK = false; } }

/* ===================== Мелкие помощники ===================== */
function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
function ipow(b,e){ var r=1; for (var i=0;i<e;i++) r*=b; return r; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }

/* ===================== Запись формул ===================== */
// S('a^2b^{m+n}*c') -> a<sup>2</sup>b<sup>m+n</sup> · c
function S(s){ return String(s).replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/\^(\d+|[a-zA-Z])/g,'<sup>$1</sup>').replace(/\*/g,' · '); }
function M(x){ return '<span class="m">' + x + '</span>'; }
function X(s){ return M(S(s)); }
function P(b,e){ return (e===1||e==='1') ? String(b) : b + '<sup>' + e + '</sup>'; }
function F(n,d){ return '<span class="fr"><span class="fn">' + n + '</span><span class="fd">' + d + '</span></span>'; }
function num(n){ return n < 0 ? '−' + (-n) : String(n); }
function mono(c,e,order){
  order = order || Object.keys(e);
  var vs = order.filter(function(v){ return e[v] > 0; });
  var s = '';
  if (c === -1 && vs.length) s = '−';
  else if (c !== 1 || !vs.length) s = num(c);
  vs.forEach(function(v){ s += P(v, e[v]); });
  return s;
}
function word(n, one, few, many){ var a=n%10, b=n%100; if (a===1&&b!==11) return one; if (a>=2&&a<=4&&(b<12||b>14)) return few; return many; }

var RULE = {
  mult: 'Правило: ' + X('a^m * a^n = a^{m+n}') + '. Основания одинаковые, степени умножаются — показатели складываются.',
  div: 'Правило: ' + M(F(S('a^m'),S('a^n')) + ' = ' + S('a^{m−n}')) + ', a ≠ 0. Показатели вычитаются. Если в знаменателе множителей больше, остаток остаётся в знаменателе.',
  pp: 'Правило: ' + X('(a^m)^n = a^{m·n}') + '. Степень в степени — показатели перемножаются.',
  prod: 'Правило: ' + X('(ab)^n = a^nb^n') + '. Внешняя степень действует на каждый множитель в скобке, включая число.',
  frac: 'Правило: ' + M('(' + F('a','b') + ')<sup>n</sup> = ' + F(S('a^n'),S('b^n'))) + ', b ≠ 0. В степень возводятся и числитель, и знаменатель.',
  zero: 'Правило: ' + X('a^0 = 1') + ' при a ≠ 0. Например, ' + M(F(S('a^3'),S('a^3'))) + ' = 1, а по правилу деления это ' + X('a^{3−3} = a^0') + '.',
  traps: 'Помни: правило ' + X('(ab)^n = a^nb^n') + ' — только для произведения, не для суммы. Минус входит в основание, только если он стоит внутри скобок: ' + X('(−2)^4') + ' и ' + X('−2^4') + ' — разные выражения.',
  inv: 'Обратное применение: ' + X('a^nb^n = (ab)^n') + ' и ' + X('a^{mn} = (a^m)^n') + '. Число тоже нужно записать как степень с тем же показателем.',
  num: 'Разложи числа на простые множители (например, 10 = 2·5, 27 = 3³), затем сократи степени с одинаковыми основаниями.',
  mixed: 'Делай по одному действию: сначала раскрой скобки со степенями, потом умножай или сокращай степени с одинаковыми основаниями.'
};
var SKILLS = {mult:'Умножение степеней', div:'Деление степеней', pp:'Степень в степени', prod:'Степень произведения', frac:'Степень дроби', inv:'Запись в виде степени (обратно)', num:'Разложение чисел и сокращение', mixed:'Несколько правил сразу', zero:'Нулевой показатель', traps:'Ловушки: минус и сумма'};
var DEFAULT_HINTS = {
  mult:['Какие основания здесь одинаковые? Какое действие стоит между степенями?', RULE.mult, 'Запиши одно основание, а показатели через знак «+».'],
  div:['Какие основания одинаковые в числителе и знаменателе? Где множителей больше?', RULE.div, 'Сократи пары одинаковых множителей и посчитай, сколько осталось и где.'],
  pp:['Здесь степени умножаются или степень возводится в степень?', RULE.pp, 'Перемножь показатели: внутренний и внешний.'],
  prod:['Какие множители стоят внутри скобки? Перечисли их все, включая число.', RULE.prod, 'Возведи в степень каждый множитель отдельно.'],
  frac:['Что стоит в числителе, а что в знаменателе?', RULE.frac, 'Возведи в степень отдельно числитель и отдельно знаменатель.'],
  zero:['Что получится, если степень разделить на такую же степень?', RULE.zero, 'Любое число, кроме нуля, в нулевой степени равно 1.'],
  traps:['Что стоит в скобках: произведение или сумма? Входит ли минус в скобки?', RULE.traps, 'Сначала посчитай то, что в скобках, потом возводи в степень.'],
  inv:['Какой показатель должен получиться у каждого множителя после возведения в степень?', RULE.inv, 'Запиши число и каждую букву как степень с нужным показателем.'],
  num:['На какие простые множители раскладываются числа в задании?', RULE.num, 'Запиши каждое число как степень простого числа или произведение степеней.'],
  mixed:['Какое действие нужно сделать первым?', RULE.mixed, 'Сначала избавься от скобок со степенями.']
};

/* Типы ошибок: название, карточка для повторения, генераторы похожих заданий */
var CATS = {
  add_mult:{t:'Путаю: складывать или перемножать показатели', card:'pp', gens:['cmp','mult1','pp1','pp2']},
  coef_forgot:{t:'Забываю возвести число в степень', card:'prod', gens:['prod2','fracpow','prodBig']},
  diff_bases:{t:'Складываю показатели у разных оснований', card:'mult', gens:['diff','recip','mult3']},
  remainder:{t:'Путаю, где остаются множители после сокращения', card:'div', gens:['divLess','numdec']},
  div_sub:{t:'Ошибаюсь при делении степеней', card:'div', gens:['div1','div2']},
  inv_coef:{t:'Забываю про число при записи в виде степени', card:'prod', gens:['inv2']},
  unfinished:{t:'Не довожу преобразование до конца', card:'prod', gens:['inv2','divLess','numdec']},
  sum_pow:{t:'Возвожу сумму в степень по частям', card:'traps', gens:['sum']},
  minus:{t:'Путаю (−2)⁴ и −2⁴', card:'traps', gens:['minus']},
  calc:{t:'Ошибки в вычислении чисел', card:null, gens:['mult2','prod2','numdec']},
  'skill:mult':{t:'Умножение степеней', card:'mult', gens:['mult1','mult2','mult3']},
  'skill:div':{t:'Деление степеней', card:'div', gens:['div1','div2','divLess']},
  'skill:pp':{t:'Степень в степени', card:'pp', gens:['pp1','pp2']},
  'skill:prod':{t:'Степень произведения', card:'prod', gens:['prod1','prod2','prodBig']},
  'skill:frac':{t:'Степень дроби', card:'frac', gens:['fracpow','recip']},
  'skill:inv':{t:'Запись в виде степени', card:'prod', gens:['inv1','inv2']},
  'skill:num':{t:'Разложение чисел и сокращение', card:'prod', gens:['numdec','numdec2']},
  'skill:mixed':{t:'Несколько правил сразу', card:'pp', gens:['mixed','pp2']},
  'skill:zero':{t:'Нулевой показатель', card:'zero', gens:['zero']},
  'skill:traps':{t:'Ловушки: минус и сумма', card:'traps', gens:['minus','sum']}
};

/* ===================== Задание ===================== */
function T(o){
  o.skill = o.skill || 'mixed';
  o.cat = o.cat || ('skill:' + o.skill);
  o.vars = o.vars || [];
  if (o.coef === undefined) o.coef = true;
  var dh = DEFAULT_HINTS[o.skill] || DEFAULT_HINTS.mixed;
  o.hints = o.hints || dh.slice();
  while (o.hints.length < 3) o.hints.push(dh[o.hints.length]);
  o.ansHtml = o.ansHtml || ansHtml(o);
  o.solution = o.solution || ('<p>Ответ: ' + o.ansHtml + '</p>');
  o.ask = o.ask || '';
  o.simGen = o.simGen || o.gen;
  return o;
}
function ansHtml(t){
  var a = t.ans;
  switch (t.type) {
    case 'mono': return M(mono(a.c, a.e, t.vars));
    case 'frac': return M(F(mono(a.n.c, a.n.e, t.vars), mono(a.d.c, a.d.e, t.vars)));
    case 'nfrac': return M(a.d === 1 ? num(a.n) : F(num(a.n), num(a.d)));
    case 'int': return M(num(a));
    case 'powprod': return M('(' + mono(a.k, a.e, t.vars) + ')<sup>' + t.N + '</sup>');
    case 'choice': return t.opts.filter(function(x){return x.ok;}).map(function(x){return x.html;}).join(' или ');
  }
  return '';
}
function CH(o){ // варианты: [html, верно?, пояснение, категория]
  o.type = 'choice';
  o.opts = o.opts.map(function(x,i){ return {id:'o'+i, html:x[0], ok:!!x[1], fb:x[2]||'', cat:x[3]}; });
  if (o.mix) o.opts = shuffle(o.opts);
  return T(o);
}
function IN(o){ // целое число; o.d = {значение:[сообщение, категория]}
  o.type = 'int';
  var d = o.d || {};
  var extra = o.diag;
  o.diag = function(u){ var r = d[u.v]; if (r) return {msg:r[0], cat:r[1]||o.cat}; return extra ? extra(u) : null; };
  return T(o);
}

function runTask(box, t, o){

    (t.prompt ? '<div class="prompt">' + t.prompt + '</div>' : '') +

function logError(t, cat){
  if (!CATS[cat]) cat = 'skill:' + t.skill;
  D.errors[cat] = (D.errors[cat]||0) + 1;
  D.recent.push({cat:cat, sig:t.sig || '', gen:t.gen || ''}); if (D.recent.length > 40) D.recent = D.recent.slice(-40);
  save(); return cat;
}
function recentSigs(){ return D.recent.map(function(r){ return r.sig; }); }

/* ===================== Навигация ===================== */
var app = $('#app'), VIEWS = {}, timerId = null;
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }
function go(view){

}
function back(view, label){ return '<button class="btn sm ghost" type="button" data-go="' + view + '">← ' + label + '</button>'; }
app.addEventListener('click', function(e){ var b = e.target.closest('[data-go]'); if (b) { var a = b.dataset.arg; go(b.dataset.go, a === undefined ? undefined : (isNaN(+a) ? a : +a)); } });

VIEWS.tproblem = function(i){
  var pb = TOGETHER[i], steps = pb.steps(), k = 0, log = [];
  app.innerHTML = back('together','Все задания') + '<h2>' + pb.t + '</h2><div class="prompt">' + pb.p + '</div>' +
    '<div class="work" id="work"><b>Запись решения</b><ol id="wlist"></ol></div><p class="prog" id="sprog"></p><div class="card" id="sbox" tabindex="-1"></div>' +
    '<div class="btns"><button class="btn ghost" type="button" id="fullSol">Показать всё решение</button></div><div id="fullBox"></div>';

  function step(){
    if (k >= steps.length) {
      D.together[i] = 1; save();
      $('#sprog').textContent = 'Все шаги пройдены';
      $('#sbox').innerHTML = '<div tabindex="-1" id="tDone"><h3 style="margin-top:0">Готово</h3><p>' + pb.fin + '</p><p>Теперь попробуй похожее задание сама, без пошаговых вопросов.</p><div class="btns"><button class="btn primary" type="button" id="tSim">Похожее задание</button><button class="btn ghost" type="button" data-go="together">К списку</button></div></div>';
      $('#tSim').addEventListener('click', function(){ go('practice', {gens:[pb.sim], title:'Похожее на «' + pb.t + '»'}); });
      reveal($('#tDone')); return;
    }
    $('#sprog').textContent = 'Шаг ' + (k+1) + ' из ' + steps.length;
    var s = steps[k];
    runTask($('#sbox'), s.task, {next:{label:'Дальше', fn:function(){ k++; step(); reveal($('#sbox')); }},
      onOk:function(t){ log.push(s.after); drawLog(); }, onBad:function(t,r){ logError(t, r.cat); }});
  }
  $('#fullSol').addEventListener('click', function(){
    $('#fullBox').innerHTML = '<div class="solbox" tabindex="-1"><h3>Всё решение</h3><ol>' + steps.map(function(s){ return s.after ? '<li>' + s.after + '</li>' : ''; }).join('') + '</ol><p><b>Итог:</b> ' + pb.fin + '</p><p class="small">Теперь реши похожее задание самостоятельно.</p><div class="btns"><button class="btn primary" type="button" id="fSim">Решить похожее задание</button></div></div>';
    mountWidgets($('#fullBox'));
    $('#fSim').addEventListener('click', function(){ go('practice', {gens:[pb.sim], title:'Похожее на «' + pb.t + '»'}); });
    reveal($('#fullBox .solbox'));
  });
  drawLog(); step();
};

var LEVELS = [null,
  {t:'Простые степени', g:['mult1','div1','pp1','cmp']},
  {t:'Числа и несколько букв', g:['mult2','mult3','div2','diff','zero','cmp']},
  {t:'Степень произведения', g:['prod1','prod2','prodBig','F1','F2','pp1']},
  {t:'Запись в виде степени (обратно)', g:['inv1','inv2','F3','F4','prod2']},
  {t:'Дроби и сокращение', g:['divLess','recip','fracpow','numdec','F5','div2']},
  {t:'Смешанные задания', g:['mixed','pp2','numdec2','F6','F7','minus','sum','inv2']}];
VIEWS.practice = function(cfg){
  cfg = cfg || null;
  var sessErr = {}, shown = [], count = 0;
  function header(){
    if (cfg) return back('home','Главная') + '<h2>Тренировка: ' + cfg.title + '</h2>';
    return '<h2>Самостоятельная тренировка</h2><p class="small muted">Уровень растёт после 4 заданий подряд, решённых с первой попытки без подсказок. Уровень можно выбрать и вручную.</p><div class="lvls" role="group" aria-label="Уровень">' +
      [1,2,3,4,5,6].map(function(n){ return '<button class="btn sm ghost" type="button" data-lv="' + n + '" aria-current="' + (n===D.level) + '" title="' + LEVELS[n].t + '">' + n + '</button>'; }).join('') + '</div><p><b>Уровень ' + D.level + ':</b> ' + LEVELS[D.level].t + '. Подряд без ошибок: ' + D.streak + ' из 4.</p>';
  }
  app.innerHTML = '<div id="phead"></div><div id="review"></div><div class="card" id="pbox" tabindex="-1"></div>';
  function drawHead(){ $('#phead').innerHTML = header(); }
  $('#phead').addEventListener('click', function(e){ var b = e.target.closest('[data-lv]'); if (!b) return; D.level = +b.dataset.lv; D.streak = 0; save(); drawHead(); next(); });
  function next(gens){
    $('#review').innerHTML = '';
    var pool = gens || (cfg ? cfg.gens : LEVELS[D.level].g);
    var t = freshTask(pool, shown.slice(-6).concat(cfg && cfg.avoid ? cfg.avoid : []));
    shown.push(t.sig); count++;
    runTask($('#pbox'), t, {
      next:{label:'Следующее задание', fn:function(){ next(); reveal($('#pbox')); }},
      similar:function(t){ next([t.simGen]); reveal($('#pbox')); },
      onOk:function(t, info){
        if (info.clean) { statOk(t.skill); if (cfg && cfg.onFix) cfg.onFix(t); }
        if (!cfg) {
          if (info.clean) D.streak++; else D.streak = 0;
          var nx = $('.next', info.box);
          if (D.streak >= 4 && D.level < 6) {
            D.level++; D.maxLevel = Math.max(D.maxLevel, D.level); D.streak = 0;
            nx.insertAdjacentHTML('beforebegin', '<div class="fb info" style="display:block"><p>Четыре задания подряд решены с первой попытки. Открыт уровень ' + D.level + ': ' + LEVELS[D.level].t + '. Следующее задание будет с этого уровня.</p></div>');
          }
          save(); drawHead();
        }
      },
      onBad:function(t, r, tries){
        statBad(t.skill); var cat = logError(t, r.cat);
        if (!cfg) { D.streak = 0; save(); drawHead(); }
        sessErr[cat] = (sessErr[cat]||0) + 1;
        if (sessErr[cat] >= 2 && CATS[cat] && CATS[cat].card) { sessErr[cat] = 0; showReview(cat); }
      }});
  }
  function showReview(cat){
    var c = CATS[cat];
    var rv = $('#review');
    rv.innerHTML = '<div class="review" tabindex="-1"><p><b>Короткое повторение.</b> Несколько раз подряд встретилась одна и та же трудность: «' + c.t + '». Вот нужное правило:</p>' + miniCard(c.card) + '<div class="btns"><button class="btn primary" type="button" id="rvOk">Понятно, продолжаю</button><button class="btn ghost" type="button" data-go="card" data-arg="' + c.card + '">Открыть карточку целиком</button></div></div>';
    $('#rvOk').addEventListener('click', function(){ rv.innerHTML = ''; reveal($('#pbox')); });
    reveal($('.review', rv));
  }
  drawHead(); next();
};

VIEWS.testrun = function(cfg){
  var tasks = TEST_PLAN.map(function(g){ return freshTask(g); }), vals = tasks.map(function(){ return null; }), cur = 0, left = 25*60;
  app.innerHTML = '<h2>Пробная контрольная</h2>' + (cfg.timer ? '<p>Осталось: <span class="timer" id="tmr" aria-live="off"></span></p>' : '') + '<div class="qnav" id="qnav" role="group" aria-label="Задания"></div><div class="card" id="tq" tabindex="-1"></div>' +
    '<div class="btns"><button class="btn ghost" type="button" id="tPrev">← Назад</button><button class="btn primary" type="button" id="tNext">Дальше →</button><button class="btn" type="button" id="tEnd">Завершить</button></div><div id="tConfirm"></div>';
  function answered(i){ return vals[i] && evalTask(tasks[i], vals[i]).st !== 'empty'; }
  function store(){ var r = $('#tq .task'); if (r) vals[cur] = readVals(r); }
  function draw(){
    $('#qnav').innerHTML = tasks.map(function(t,i){ return '<button class="btn sm ghost' + (answered(i) ? ' has' : '') + '" type="button" data-q="' + i + '" aria-current="' + (i===cur) + '" aria-label="Задание ' + (i+1) + (answered(i) ? ', есть ответ' : '') + '">' + (i+1) + '</button>'; }).join('');
    var t = tasks[cur];
    $('#tq').innerHTML = '<p class="prog">Задание ' + (cur+1) + ' из 10</p><div class="task"><div class="prompt">' + t.prompt + '</div><p class="ask">' + t.ask + '</p><div class="inp">' + inputUI(t) + '</div>' + noteFor(t) + '</div>';
    fillVals($('#tq'), vals[cur]);
    $('#tPrev').disabled = cur === 0; $('#tNext').disabled = cur === 9;
  }
  $('#tq').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.opt) { $$('#tq .opt').forEach(function(x){ x.setAttribute('aria-pressed','false'); }); b.setAttribute('aria-pressed','true'); store(); draw(); }
    if (b.dataset.a === 'sign') { var inp = $('#tq input[data-f=v]'); var s = inp.value.trim(); inp.value = /^[−-]/.test(s) ? s.replace(/^[−-]/,'') : '−' + s; store(); } });
  $('#tq').addEventListener('input', store);
  $('#qnav').addEventListener('click', function(e){ var b = e.target.closest('[data-q]'); if (!b) return; store(); cur = +b.dataset.q; draw(); });
  $('#tPrev').addEventListener('click', function(){ store(); if (cur > 0) { cur--; draw(); } });
  $('#tNext').addEventListener('click', function(){ store(); if (cur < 9) { cur++; draw(); reveal($('#tq')); } });
  $('#tEnd').addEventListener('click', function(){
    store(); draw();
    var empty = tasks.filter(function(t,i){ return !answered(i); }).length;
    if (!empty) return finish();
    $('#tConfirm').innerHTML = '<div class="fb info" tabindex="-1" style="display:block"><p>Без ответа: ' + empty + ' ' + word(empty,'задание','задания','заданий') + '. Завершить всё равно?</p><div class="btns"><button class="btn primary" type="button" id="cYes">Завершить</button><button class="btn ghost" type="button" id="cNo">Вернуться к заданиям</button></div></div>';
    $('#cYes').addEventListener('click', finish); $('#cNo').addEventListener('click', function(){ $('#tConfirm').innerHTML = ''; });
    reveal($('#tConfirm .fb'));
  });
  function tick(){ var el = $('#tmr'); if (!el) return; el.textContent = Math.floor(left/60) + ':' + ('0' + left%60).slice(-2); if (left <= 0) { stopTimer(); finish(true); } left--; }
  if (cfg.timer) { tick(); timerId = setInterval(tick, 1000); }
  function finish(byTimer){
    stopTimer(); store();
    var res = tasks.map(function(t,i){ return evalTask(t, vals[i] || {}); });
    var by = {}, score = 0;
    res.forEach(function(r,i){ var t = tasks[i], pts = r.st === 'ok' ? 1 : r.st === 'part' ? .5 : 0; score += pts;
      var b = by[t.skill] = by[t.skill] || {n:0, p:0}; b.n++; b.p += pts;
      if (pts === 1) statOk(t.skill); else { statBad(t.skill); if (r.st === 'bad' || r.st === 'part') logError(t, r.cat); else logError(t, t.cat); } });
    var d = new Date(); D.tests.push({date:d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}), score:score}); if (D.tests.length > 30) D.tests = D.tests.slice(-30); save();
    var weak = Object.keys(by).filter(function(k){ return by[k].p < by[k].n; });
    app.innerHTML = '<h2>Результаты пробной контрольной</h2><div class="card" tabindex="-1" id="tRes">' + (byTimer ? '<p>Время вышло — работа завершена автоматически.</p>' : '') +
      '<p style="font-size:1.25rem"><b>' + String(score).replace('.',',') + ' из 10</b></p><p class="small muted">Полностью верный ответ — 1 балл, «верно, но не закончено» — 0,5 балла.</p>' +
      '<h3>По навыкам</h3><table><tr><th>Навык</th><th>Результат</th><th></th></tr>' + Object.keys(by).map(function(k){ var b = by[k], c = CATS['skill:'+k]; return '<tr><td>' + SKILLS[k] + '</td><td>' + String(b.p).replace('.',',') + ' из ' + b.n + '</td><td>' + (b.p < b.n && c && c.card ? '<button class="btn sm ghost" type="button" data-go="card" data-arg="' + c.card + '">Повторить</button>' : (b.p === b.n ? 'получилось' : '')) + '</td></tr>'; }).join('') + '</table>' +
      (weak.length ? '<p>Стоит потренировать: ' + weak.map(function(k){ return SKILLS[k]; }).join(', ') + '. Ошибки добавлены в раздел «Мои ошибки».</p>' : '<p>Все навыки этой работы получились.</p>') +
      '<div class="btns"><button class="btn primary" type="button" data-go="mistakes">Мои ошибки</button><button class="btn" type="button" data-go="test">Ещё одна контрольная</button></div></div><h3>Разбор заданий</h3>' +
      tasks.map(function(t,i){ var r = res[i]; var lab = r.st === 'ok' ? '✓ Верно' : r.st === 'part' ? '≈ Верно, но не закончено' : r.st === 'empty' ? '— Нет ответа' : '✗ Неверно';
        return '<div class="card"><p><b>' + (i+1) + '.</b> <span class="tag">' + SKILLS[t.skill] + '</span></p><div class="prompt">' + t.prompt + '</div><p class="small">' + t.ask + '</p>' +
          '<p><b>' + lab + '.</b> Твой ответ: ' + userHtml(t, vals[i]) + '</p>' + (r.st !== 'ok' ? '<p>Верный ответ: ' + t.ansHtml + '</p>' + (r.msg ? '<p class="small">' + r.msg + '</p>' : '') : '') +
          '<details><summary>Решение</summary>' + t.solution + '</details></div>'; }).join('');
    $$('details', app).forEach(function(d){ d.addEventListener('toggle', function(){ if (d.open) mountWidgets(d); }); });
    window.scrollTo(0,0); reveal($('#tRes'));
  }
  draw();
};

go('home');

</script>
